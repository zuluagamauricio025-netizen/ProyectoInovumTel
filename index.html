<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Usuario - InovumTel</title>

    <!-- ESTILOS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- ICONOS (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<!-- Logo -->
<div class="logo-container">
    <img src="Images/capturalogo.jpg" alt="Hotel Balcón de Cocorná" class="logo">
</div>

<!-- Títulos -->
<div class="title-section">
    <h1>Validación de Usuario – InovumTel</h1>
    <p>Hotel Balcón de Cocorná</p>
</div>

<!-- Tarjeta de Login -->
<div class="login-card">
    <form action="menuprincipal.html" method="get">

        <!-- Usuario -->
        <div class="form-group">
            <label for="usuario">Usuario o Correo Electrónico</label>
            <div class="input-wrapper">
                <span class="input-icon left-icon">
                    <i class="fa-regular fa-user"></i>
                </span>
                <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario o correo" required>
            </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <span class="input-icon left-icon">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>

                <button type="button" class="toggle-password" onclick="togglePassword()">
                    <i class="fa-regular fa-eye-slash" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn-login">Ingresar</button>

        <!-- Recuperar -->
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

    </form>
</div>

<!-- Footer -->
<div class="footer-text">
    <p>Sistema InovumTel © 2025</p>
    <p>Hotel Balcón de Cocorná</p>
</div>

<!-- SCRIPT -->
<script>
function togglePassword() {
    const password = document.getElementById("password");
    const icon = document.getElementById("eyeIcon");

    if (password.type === "password") {
        password.type = "text";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    } else {
        password.type = "password";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }
}
</script>

</body>
</html>
